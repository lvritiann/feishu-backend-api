# Render Blueprint —— 非油销量预测 · 飞书后端
# 部署方式：在 Render 新建 Blueprint，连到本仓库，Root Directory 填 server
services:
  - type: web
    name: feishu-backend
    runtime: node
    plan: free
    region: singapore          # 距中国最近；若免费实例不支持该区，改成 oregon
    branch: main
    buildCommand: "npm install"
    startCommand: "node server.mjs"
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DOC_PLATFORM
        value: feishu
      - key: FEISHU_APP_ID
        value: cli_aad775b976391d10
      - key: FEISHU_SPREADSHEET_ID
        value: Dc1hsrhkYhw2lht3kYUcPyYUn9d
      # 以下为密钥，sync:false 表示不在文件里、由你在 Render 后台手动填写
      - key: FEISHU_APP_SECRET
        sync: false
